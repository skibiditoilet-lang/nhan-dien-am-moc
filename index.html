<script>

const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/APt4HkIei/";

let model = null;
let stream = null;


// ========================================
// TẢI MODEL
// ========================================

async function loadModel() {

    try {

        document.getElementById("status").innerText =
            "Đang tải mô hình AI...";

        model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json"
        );

        document.getElementById("startBtn").disabled = false;

        document.getElementById("status").innerText =
            "Mô hình đã sẵn sàng. Nhấn Mở camera.";

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Không tải được mô hình AI.";

        document.getElementById("status").classList.add("error");

    }

}


// ========================================
// MỞ CAMERA
// ========================================

async function openCamera() {

    if (!model) {

        document.getElementById("status").innerText =
            "Mô hình AI chưa tải xong.";

        return;

    }


    try {

        document.getElementById("status").classList.remove("error");

        document.getElementById("status").innerText =
            "Đang mở camera...";


        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Trình duyệt không hỗ trợ camera."
            );

        }


        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },

            audio: false

        });


        const video =
            document.getElementById("video");


        video.srcObject = stream;


        await video.play();


        video.style.display = "block";

        document.getElementById("photo").style.display =
            "none";


        document.getElementById("startBtn").style.display =
            "none";

        document.getElementById("captureBtn").style.display =
            "inline-block";

        document.getElementById("againBtn").style.display =
            "none";


        document.getElementById("status").innerText =
            "Đưa quả táo vào khung hình rồi nhấn Chụp ảnh.";

    }

    catch (error) {

        console.error(error);

        let message =
            "Không thể mở camera.";

        if (error.name === "NotAllowedError") {

            message =
                "Camera bị từ chối. Hãy cho phép trình duyệt sử dụng camera.";

        }

        else if (error.name === "NotFoundError") {

            message =
                "Không tìm thấy camera trên thiết bị.";

        }

        else if (error.name === "NotReadableError") {

            message =
                "Camera đang được sử dụng bởi ứng dụng khác.";

        }

        else if (error.name === "SecurityError") {

            message =
                "Trình duyệt đang chặn camera vì lý do bảo mật.";

        }


        document.getElementById("status").innerText =
            message;

        document.getElementById("status").classList.add("error");

    }

}


// ========================================
// CHỤP ẢNH
// ========================================

async function capturePhoto() {

    const video =
        document.getElementById("video");

    const canvas =
        document.getElementById("photo");


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        document.getElementById("status").innerText =
            "Camera chưa sẵn sàng.";

        return;

    }


    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    // Chụp đúng 1 frame
    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Dừng camera NGAY SAU KHI CHỤP
    stopCamera();


    // Ẩn camera
    video.style.display = "none";

    // Hiện ảnh vừa chụp
    canvas.style.display = "block";


    document.getElementById("captureBtn").style.display =
        "none";

    document.getElementById("againBtn").style.display =
        "inline-block";


    document.getElementById("status").classList.remove("error");

    document.getElementById("status").innerText =
        "Đang phân tích ảnh...";


    document.getElementById("result").innerText =
        "🔍 Đang phân tích...";


    try {

        const prediction =
            await model.predict(canvas);

        showResult(prediction);

    }

    catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Không thể phân tích ảnh.";

        document.getElementById("status").classList.add("error");

    }

}


// ========================================
// PHÂN TÍCH ẢNH TỪ MÁY
// ========================================

async function analyzeFile(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    if (!model) {

        document.getElementById("status").innerText =
            "Mô hình AI chưa tải xong.";

        return;

    }


    stopCamera();


    const img =
        new Image();


    img.onload = async function() {

        const canvas =
            document.getElementById("photo");

        canvas.width =
            img.naturalWidth;

        canvas.height =
            img.naturalHeight;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        document.getElementById("video").style.display =
            "none";

        canvas.style.display =
            "block";


        document.getElementById("startBtn").style.display =
            "none";

        document.getElementById("captureBtn").style.display =
            "none";

        document.getElementById("againBtn").style.display =
            "inline-block";


        document.getElementById("status").innerText =
            "Đang phân tích ảnh...";


        document.getElementById("result").innerText =
            "🔍 Đang phân tích...";


        try {

            const prediction =
                await model.predict(canvas);

            showResult(prediction);

        }

        catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Không thể phân tích ảnh.";

            document.getElementById("status").classList.add("error");

        }

    };


    img.src =
        URL.createObjectURL(file);

}


// ========================================
// HIỂN THỊ KẾT QUẢ
// ========================================

function showResult(prediction) {

    let bestClass = "";

    let bestProbability = 0;


    for (
        let i = 0;
        i < prediction.length;
        i++
    ) {

        const probability =
            prediction[i].probability;


        const percent =
            Math.round(
                probability * 100
            );


        const percentElement =
            document.getElementById(
                "percent" + i
            );


        const barElement =
            document.getElementById(
                "bar" + i
            );


        if (percentElement) {

            percentElement.innerText =
                percent + "%";

        }


        if (barElement) {

            barElement.style.width =
                percent + "%";

        }


        if (
            probability >
            bestProbability
        ) {

            bestProbability =
                probability;

            bestClass =
                prediction[i].className;

        }

    }


    if (bestProbability < 0.65) {

        document.getElementById("result").innerText =
            "❓ Không chắc chắn";

        document.getElementById("status").innerText =
            "AI chưa đủ chắc chắn về kết quả.";

    }

    else {

        document.getElementById("result").innerText =
            "🔎 " + bestClass;

        document.getElementById("status").innerText =
            "Phân tích hoàn tất.";

    }

}


// ========================================
// DỪNG CAMERA
// ========================================

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(
            function(track) {
                track.stop();
            }
        );

        stream = null;

    }


    const video =
        document.getElementById("video");

    video.srcObject = null;

}


// ========================================
// CHỤP LẠI
// ========================================

function resetCamera() {

    document.getElementById("result").innerText =
        "Chưa có kết quả";


    document.getElementById("status").classList.remove("error");


    document.getElementById("status").innerText =
        "Đang chuẩn bị camera...";


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const percent =
            document.getElementById(
                "percent" + i
            );

        const bar =
            document.getElementById(
                "bar" + i
            );


        if (percent) {

            percent.innerText =
                "0%";

        }


        if (bar) {

            bar.style.width =
                "0%";

        }

    }


    document.getElementById("photo").style.display =
        "none";


    document.getElementById("video").style.display =
        "block";


    openCamera();

}


// ========================================
// KHI ĐÓNG / RỜI TRANG
// ========================================

window.addEventListener(
    "beforeunload",
    function() {

        stopCamera();

    }
);


// ========================================
// BẮT ĐẦU TẢI MODEL
// ========================================

loadModel();

</script>

</body>
</html>
