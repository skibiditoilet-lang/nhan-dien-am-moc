```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Nhận Diện Táo</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        #camera-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        video,
        canvas {
            width: 400px;
            height: 400px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 18px;
            background: #ddd;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        #photo {
            display: none;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #1b5e20;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #capture-button {
            display: none;
        }

        #retry-button {
            display: none;
        }

        #status {
            color: #666;
            margin: 15px 0;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .prediction {
            text-align: left;
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .prediction-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .bar {
            width: 100%;
            height: 15px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .note {
            font-size: 13px;
            color: #777;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍎 AI Nhận Diện Táo</h1>

    <div class="subtitle">
        Phân biệt Táo Tàu, Đại Táo và Mốc
    </div>

    <button id="start-button" onclick="startCamera()">
        📷 Mở camera
    </button>

    <button id="capture-button" onclick="capturePhoto()">
        📸 Chụp ảnh & Phân tích
    </button>

    <button id="retry-button" onclick="restartCamera()">
        🔄 Chụp lại
    </button>

    <div id="status">
        Nhấn "Mở camera" để bắt đầu
    </div>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="photo"></canvas>
    </div>

    <div id="result">
        Chưa nhận diện
    </div>

    <div class="prediction">

        <div class="prediction-title">
            <span>Táo Tàu</span>
            <span id="percent0">0%</span>
        </div>

        <div class="bar">
            <div class="bar-fill" id="bar0"></div
