<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Nhận Diện Táo</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

            margin: 0;

            margin-bottom: 15px;

            font-size: 13px;

        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍎 AI Nhận Diện Táo</h1>

    <div class="subtitle">
        Nhận diện Táo Tàu, Đại Táo và Mốc bằng AI
    </div>

    <button onclick="startCamera()">
        📷 Bắt đầu nhận diện
    </button>

    <div id="status">
        Nhấn nút để bật camera
    </div>

    <div id="webcam-container"></div>

    <div id="result">
        Chưa nhận diện
    </div>

    <div id="predictions">

        <div class="prediction">
            <div class="prediction-title">
                <span>Táo Tàu</span>
                <span id="percent0">0%</span>
            </div>

            <div class="bar">
                <div class="bar-fill" id="bar0"></div>
            </div>
        </div>

        <div class="prediction">
            <div class="prediction-title">
                <span>Đại Táo</span>
                <span id="percent1">0%</span>
            </div>

            <div class="bar">
                <div class="bar-fill" id="bar1"></div>
            </div>
        </div>

        <div class="prediction">
            <div class="prediction-title">
                <span>Mốc</span>
                <span id="percent2">0%</span>
            </div>

            <div class="bar">
                <div class="bar-fill" id="bar2"></div>
            </div>
        </div>

    </div>

    <div class="note">
        AI sử dụng mô hình được huấn luyện bằng Google Teachable Machine.
    </div>

</div>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/APt4HkIei/";

let model;
let webcam;
let maxPredictions;
let running = false;

async function startCamera() {

    if (running) {
        return;
    }

    try {

        document.getElementById("status").innerText =
            "Đang tải mô hình AI...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);

        maxPredictions = model.getTotalClasses();

        webcam = new tmImage.Webcam(400, 400, true);

        await webcam.setup();

        await webcam.play();

        running = true;

        document.getElementById("status").innerText =
            "Camera đang hoạt động";

        document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);

        window.requestAnimationFrame(loop);

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Không thể mở camera. Hãy cho phép trình duyệt sử dụng camera.";

    }
}


async function loop() {

    if (!running) {
        return;
    }

    webcam.update();

    await predict();

    window.requestAnimationFrame(loop);
}


async function predict() {

    const prediction = await model.predict(webcam.canvas);

    let bestClass = "";
    let bestProbability = 0;

    for (let i = 0; i < maxPredictions; i++) {

        const className = prediction[i].className;
        const probability = prediction[i].probability;

        const percent = Math.round(probability * 100);

        document.getElementById("percent" + i).innerText =
            percent + "%";

        document.getElementById("bar" + i).style.width =
            percent + "%";

        if (probability > bestProbability) {

            bestProbability = probability;
            bestClass = className;

        }
    }

    if (bestProbability < 0.65) {

        document.getElementById("result").innerText =
            "❓ Không chắc chắn";

    } else {

        document.getElementById("result").innerText =
            "🔎 " + bestClass;

    }
}

</script>

</body>
</html>
